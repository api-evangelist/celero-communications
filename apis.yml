aid: celero-communications
name: Celero Communications
description: 'Celero Communications is a fabless semiconductor company headquartered
  in Irvine, California, founded in 2024 by engineering leaders drawn from Marvell,
  Inphi, Broadcom and ClariPhy. The company designs coherent digital signal processing
  (DSP) silicon for high-bandwidth, low-power optical interconnect inside AI data centers,
  targeting the scale-up and scale-out optical links that connect large AI accelerator
  clusters, and it operates additional design centers in Canada and Argentina. Celero
  has raised approximately $140 million to date, including a $100 million Series B
  led by CapitalG, Alphabet''s independent growth fund, following seed and Series A
  rounds led by Sutter Hill Ventures with participation from Valor Equity Partners,
  Atreides Management and Maverick Silicon. Celero sells hardware components rather
  than a developer-facing web service; its public web presence at celero.inc is served
  behind a Cloudflare managed bot challenge, so no developer, documentation, or API
  surface could be read during profiling.'
